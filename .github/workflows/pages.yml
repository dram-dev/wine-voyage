# Publish the static cellar frontend (web/) to GitHub Pages.
#
# Nothing is built: web/ is plain HTML, CSS, and ES modules, so the job is a
# copy. The backend is not deployed here — the site talks to whatever API the
# user configures in Settings.
#
# One-time setup, and the only step that cannot be automated: Settings → Pages →
# Build and deployment → Source: "GitHub Actions". configure-pages has an
# `enablement: true` option, but creating a Pages site needs admin rights that a
# workflow's GITHUB_TOKEN does not have ("Resource not accessible by
# integration"); it only works from a PAT with the `administration` scope.
#
# The deploy is gated on the repository's *default* branch rather than a branch
# named here, so it keeps working if the default is later renamed (to `main`,
# say). Pushes to any other branch still run the syntax check, they just don't
# publish.

name: Deploy Pages

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the frontend parses
        run: |
          for file in $(find web/js -name '*.js'); do
            node --input-type=module --check < "$file" || exit 1
          done

  deploy:
    needs: check
    # Only the default branch publishes; everything else stops at the check.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
